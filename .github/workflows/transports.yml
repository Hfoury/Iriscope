name: Transports urbains (métro, RER, tram, téléphérique)

# Chaque semaine : lit dans les fichiers officiels des réseaux (GTFS, transport.data.gouv.fr, Licence Ouverte ou ODbL)
# les lignes de métro, RER, tramway, funiculaire et téléphérique urbain des villes françaises qui en ont, et les publie sur la branche « transports » (lue par l'appli, bouton Transports de la carte).
# Gratuit, sans clé. Une ville en échec garde ses données de la semaine précédente.
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      ville:
        description: 'Une seule ville (ex. rennes), vide pour toutes'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: transports
  cancel-in-progress: true

jobs:
  transports:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Données de la semaine précédente
        run: |
          mkdir -p sortie
          if git fetch -q --depth=1 origin transports 2>/dev/null; then
            git --work-tree=sortie checkout FETCH_HEAD -- . && git reset -q
          fi
          ls sortie/transports 2>/dev/null | wc -l
      - name: Calcul des lignes
        run: node --max-old-space-size=6144 outils/transports-gtfs.mjs sortie ${{ github.event.inputs.ville && format('--ville {0}', github.event.inputs.ville) || '' }}
      - name: Publication sur la branche transports
        run: |
          cd sortie
          rm -rf .git
          git init -q -b transports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Transports du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" transports
