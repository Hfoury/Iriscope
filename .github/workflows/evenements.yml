name: Evenements DATAtourisme

# Chaque nuit : télécharge les fêtes et manifestations de DATAtourisme (France entière, DOM-TOM compris),
# les découpe par département et les publie sur la branche « donnees » (lue par l'appli, sans clé).
# Gratuit. La clé reste dans le secret DATATOURISME_KEY.
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evenements
  cancel-in-progress: true

jobs:
  evenements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte
        env:
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
        run: node outils/evenements.mjs sortie
      - name: Publication sur la branche donnees
        run: |
          cd sortie
          git init -q -b donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Evenements du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" donnees
