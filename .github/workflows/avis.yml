name: Avis de la communauté

# Toutes les 3 heures : regroupe les avis (étoiles et commentaires) envoyés depuis l'appli et les publie sur la branche « avis ».
# Gratuit, sans clé. Les messages ntfy ne sont gardés que 12 heures : ce passage régulier les rend durables.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avis
  cancel-in-progress: false

jobs:
  avis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avis déjà regroupés
        run: |
          if git fetch -q --depth=1 origin avis 2>/dev/null; then git show FETCH_HEAD:avis/index.json > ancien.json || echo '{}' > ancien.json; else echo '{}' > ancien.json; fi
      - name: Regroupement
        run: node outils/avis.mjs sortie --ancien ancien.json
      - name: Publication sur la branche avis
        run: |
          cd sortie
          git init -q -b avis
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Avis du $(date -u +%F\ %H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" avis
